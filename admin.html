<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KION Mascotas Admin</title>
<style>body{font-family:Arial;margin:0;background:#eef8f6;color:#17322e}header{background:#0f766e;color:white;padding:18px}main{max-width:900px;margin:auto;padding:18px}button,a{padding:10px 12px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.primary{background:#0f766e;color:white}.danger{background:#b42318;color:white}.card{background:white;border:1px solid #d8e9e5;border-radius:15px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}.card img{width:70px;height:70px;object-fit:cover;border-radius:12px;background:#ddd}.grow{flex:1}dialog{border:0;border-radius:16px;width:min(650px,94vw)}input,textarea,select{width:100%;padding:10px;margin:5px 0 10px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><header><h2>🐾 KION Mascotas · Administración</h2></header><main><button class="primary" onclick="nuevo()">＋ Nueva mascota</button><div id="lista">Cargando…</div></main>
<dialog id="dlg"><form id="form" onsubmit="guardar(event)"><h2 id="titulo">Mascota</h2><input id="id" type="hidden"><div class="grid">
<label>Nombre<input id="nombre_mascota" required></label><label>Sexo<select id="sexo"><option></option><option>Hembra</option><option>Macho</option></select></label>
<label>Raza<input id="raza"></label><label>Color<input id="color"></label><label>Nacimiento<input id="fecha_nacimiento" type="date"></label><label>Comuna<input id="comuna"></label>
<label>Dueño<input id="nombre_dueno"></label><label>Teléfono principal<input id="telefono_principal"></label><label>Teléfono secundario<input id="telefono_secundario"></label>
<label class="full">URL foto<input id="foto_url"></label><label class="full">Observaciones<textarea id="observaciones"></textarea></label>
<label><input id="esterilizado" type="checkbox" style="width:auto"> Esterilizado/a</label><label><input id="tiene_chip" type="checkbox" style="width:auto"> Tiene chip</label></div>
<button type="button" onclick="dlg.close()">Cancelar</button> <button class="primary">Guardar</button></form></dialog>
<script>
const SUPABASE_URL="https://rughpuemhsriuiivwbag.supabase.co";
const SUPABASE_KEY="sb_publishable_Vc3jwQ_pxQlhPv6BNidZNg_iystTQtl";
const fields=["nombre_mascota","sexo","raza","color","fecha_nacimiento","comuna","nombre_dueno","telefono_principal","telefono_secundario","foto_url","observaciones"];
const $=x=>document.getElementById(x),dlg=$("dlg");
async function api(path,opt={}){let r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=representation"}});if(!r.ok)throw Error("Error "+r.status);return r.status===204?null:r.json()}
async function cargar(){try{let ps=await api("mascotas?select=*&order=id.desc");$("lista").innerHTML="";ps.forEach(p=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<img src="${p.foto_url||""}"><div class="grow"><b>${p.nombre_mascota||"Sin nombre"}</b><br><small>${[p.raza,p.color,p.comuna].filter(Boolean).join(" · ")}</small></div><button>Editar</button><a href="index.html?id=${p.id}" target="_blank">Ver ficha</a><button class="danger">Eliminar</button>`;d.children[2].onclick=()=>editar(p);d.children[4].onclick=()=>eliminar(p);$("lista").append(d)})}catch(e){$("lista").innerHTML="<p>No se pudo cargar: "+e.message+"</p>"}}
function nuevo(){$("form").reset();$("id").value="";$("titulo").textContent="Nueva mascota";dlg.showModal()}
function editar(p){$("form").reset();$("id").value=p.id;fields.forEach(f=>$(f).value=p[f]??"");$("esterilizado").checked=p.esterilizado===true;$("tiene_chip").checked=p.tiene_chip===true;$("titulo").textContent="Editar mascota";dlg.showModal()}
async function guardar(e){e.preventDefault();let data={};fields.forEach(f=>data[f]=$(f).value||null);data.esterilizado=$("esterilizado").checked;data.tiene_chip=$("tiene_chip").checked;try{let id=$("id").value;if(id)await api("mascotas?id=eq."+id,{method:"PATCH",body:JSON.stringify(data)});else await api("mascotas",{method:"POST",body:JSON.stringify(data)});dlg.close();cargar()}catch(e){alert("No se pudo guardar: "+e.message)}}
async function eliminar(p){if(!confirm("¿Eliminar "+(p.nombre_mascota||"esta mascota")+"?"))return;try{await api("mascotas?id=eq."+p.id,{method:"DELETE"});cargar()}catch(e){alert("No se pudo eliminar: "+e.message)}}
if(SUPABASE_URL.includes("TU_SUPABASE"))$("lista").innerHTML="<p><b>Falta configurar Supabase.</b> Copia la misma URL y Publishable Key de index.html.</p>";else cargar();
</script></body></html>
