<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KION Mascotas Admin</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#eef8f6;color:#17322e}
header{background:#0f766e;color:white;padding:18px}
header h2{margin:0}
main{max-width:900px;margin:auto;padding:18px}
button,a{padding:10px 12px;border:0;border-radius:10px;font-weight:bold;cursor:pointer;text-decoration:none}
.primary{background:#0f766e;color:white}
.soft{background:#dcefeb;color:#174d47}
.danger{background:#b42318;color:white}
.card{background:white;border:1px solid #d8e9e5;border-radius:15px;padding:14px;margin:10px 0;display:flex;gap:12px;align-items:center}
.card img{width:70px;height:70px;object-fit:cover;border-radius:12px;background:#ddd}
.grow{flex:1}
dialog{border:0;border-radius:16px;width:min(650px,94vw)}
input,textarea,select{width:100%;padding:10px;margin:5px 0 10px;box-sizing:border-box;border:1px solid #c9ddd8;border-radius:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.hidden{display:none!important}
#loginBox{max-width:430px;margin:45px auto;background:#fff;padding:22px;border:1px solid #d8e9e5;border-radius:18px;box-shadow:0 8px 30px #0001}
#loginBox h2{margin-top:0}
.msg{margin-top:10px;color:#b42318;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.userline{font-size:13px;color:#55716b}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>
<header><h2>🐾 KION Mascotas · Administración</h2></header>
<main>
<section id="loginBox">
  <h2>Ingresar</h2>
  <p>Acceso solo para administradores autorizados.</p>
  <form id="loginForm">
    <label>Correo<input id="loginEmail" type="email" autocomplete="username" required></label>
    <label>Contraseña<input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Entrar</button>
    <div id="loginMsg" class="msg"></div>
  </form>
</section>
<section id="adminArea" class="hidden">
  <div class="topbar">
    <div><button class="primary" onclick="nuevo()">＋ Nueva mascota</button> <button class="soft" onclick="cargar()">↻ Actualizar</button></div>
    <div><span id="usuarioActual" class="userline"></span> <button class="soft" onclick="cerrarSesion()">Cerrar sesión</button></div>
  </div>
  <div id="lista">Cargando…</div>
</section>
</main>
<dialog id="dlg">
<form id="form" onsubmit="guardar(event)">
  <h2 id="titulo">Mascota</h2><input id="id" type="hidden">
  <div class="grid">
    <label>Nombre<input id="nombre_mascota" required></label>
    <label>Sexo<select id="sexo"><option></option><option>Hembra</option><option>Macho</option></select></label>
    <label>Raza<input id="raza"></label><label>Color<input id="color"></label>
    <label>Nacimiento<input id="fecha_nacimiento" type="date"></label><label>Comuna<input id="comuna"></label>
    <label>Dueño<input id="nombre_dueno"></label><label>Teléfono principal<input id="telefono_principal"></label>
    <label>Teléfono secundario<input id="telefono_secundario"></label>
    <label class="full">URL foto<input id="foto_url"></label>
    <label class="full">Observaciones<textarea id="observaciones"></textarea></label>
    <label><input id="esterilizado" type="checkbox" style="width:auto"> Esterilizado/a</label>
    <label><input id="tiene_chip" type="checkbox" style="width:auto"> Tiene chip</label>
  </div>
  <button type="button" onclick="dlg.close()">Cancelar</button> <button class="primary" type="submit">Guardar</button>
</form>
</dialog>
<script>
const SUPABASE_URL="https://rughpuemhsriuiivwbag.supabase.co";
const SUPABASE_KEY="sb_publishable_Vc3jwQ_pxQlhPv6BNidZNg_iystTQtl";
const fields=["nombre_mascota","sexo","raza","color","fecha_nacimiento","comuna","nombre_dueno","telefono_principal","telefono_secundario","foto_url","observaciones"];
const $=x=>document.getElementById(x), dlg=$("dlg");
function token(){return sessionStorage.getItem("kion_access_token")||""}
function emailGuardado(){return sessionStorage.getItem("kion_email")||""}
async function iniciarSesion(email,password){
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  const data=await r.json();
  if(!r.ok)throw new Error(data.msg||data.error_description||"No se pudo iniciar sesión");
  sessionStorage.setItem("kion_access_token",data.access_token);
  sessionStorage.setItem("kion_email",data.user?.email||email);
}
function mostrarAdmin(){ $("loginBox").classList.add("hidden"); $("adminArea").classList.remove("hidden"); $("usuarioActual").textContent=emailGuardado(); cargar(); }
function mostrarLogin(){ $("adminArea").classList.add("hidden"); $("loginBox").classList.remove("hidden"); }
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").textContent="Ingresando…";try{await iniciarSesion($("loginEmail").value.trim(),$("loginPassword").value);$("loginMsg").textContent="";$("loginPassword").value="";mostrarAdmin()}catch(err){$("loginMsg").textContent="No se pudo ingresar. Revisa correo y contraseña."}});
function cerrarSesion(){sessionStorage.removeItem("kion_access_token");sessionStorage.removeItem("kion_email");$("lista").innerHTML="";mostrarLogin()}
async function api(path,opt={}){
  const access=token(); if(!access)throw new Error("Debes iniciar sesión");
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...opt,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+access,"Content-Type":"application/json",Prefer:"return=representation",...(opt.headers||{})}});
  if(r.status===401){cerrarSesion();throw new Error("La sesión venció. Vuelve a ingresar.")}
  if(!r.ok)throw new Error("Error "+r.status+": "+await r.text());
  if(r.status===204)return null; const text=await r.text(); return text?JSON.parse(text):null;
}
async function cargar(){try{let ps=await api("mascotas?select=*&order=id.desc");$("lista").innerHTML="";if(!ps.length)$("lista").innerHTML="<p>No hay mascotas registradas.</p>";ps.forEach(p=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<img src="${p.foto_url||""}"><div class="grow"><b>${p.nombre_mascota||"Sin nombre"}</b><br><small>${[p.raza,p.color,p.comuna].filter(Boolean).join(" · ")}</small></div><button>Editar</button><a href="index.html?id=${p.id}" target="_blank">Ver ficha</a><button class="danger">Eliminar</button>`;d.children[2].onclick=()=>editar(p);d.children[4].onclick=()=>eliminar(p);$("lista").append(d)})}catch(e){$("lista").innerHTML="<p>No se pudo cargar: "+e.message+"</p>"}}
function nuevo(){$("form").reset();$("id").value="";$("titulo").textContent="Nueva mascota";dlg.showModal()}
function editar(p){$("form").reset();$("id").value=p.id;fields.forEach(f=>$(f).value=p[f]??"");$("esterilizado").checked=p.esterilizado===true;$("tiene_chip").checked=p.tiene_chip===true;$("titulo").textContent="Editar mascota";dlg.showModal()}
async function guardar(e){e.preventDefault();let data={};fields.forEach(f=>data[f]=$(f).value||null);data.esterilizado=$("esterilizado").checked;data.tiene_chip=$("tiene_chip").checked;try{let id=$("id").value;if(id)await api("mascotas?id=eq."+id,{method:"PATCH",body:JSON.stringify(data)});else await api("mascotas",{method:"POST",body:JSON.stringify(data)});dlg.close();await cargar();alert("Cambios guardados correctamente.")}catch(e){alert("No se pudo guardar: "+e.message)}}
async function eliminar(p){if(!confirm("¿Eliminar "+(p.nombre_mascota||"esta mascota")+"?"))return;try{await api("mascotas?id=eq."+p.id,{method:"DELETE"});await cargar()}catch(e){alert("No se pudo eliminar: "+e.message)}}
if(token())mostrarAdmin();else mostrarLogin();
</script>
</body>
</html>
