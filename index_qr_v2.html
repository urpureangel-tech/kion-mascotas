<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KION Mascotas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f6;color:#17322e}
.wrap{max-width:760px;margin:auto;padding:18px}
.brand{font-weight:800;letter-spacing:.5px;margin:6px 0 14px}
.hero{position:relative;border-radius:22px;overflow:hidden;background:#dbe7e4;min-height:330px;box-shadow:0 10px 30px #0002}
.hero img{width:100%;height:330px;object-fit:cover;display:block}
.overlay{position:absolute;inset:auto 0 0 0;padding:52px 24px 22px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.name{font-size:38px;font-weight:800;line-height:1;margin:0 0 8px}
.meta{font-size:18px;margin-bottom:12px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:#ffffffdd;color:#17322e;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px}
.alert{margin:14px 0;background:#fff4f0;border:1px solid #f1d3c8;border-radius:16px;padding:16px;font-size:18px}
.card{background:#fff;border:1px solid #d8e9e5;border-radius:18px;padding:18px;margin:14px 0}
.card h3{margin:0 0 14px;font-size:15px;letter-spacing:.5px;color:#526c66}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.label{font-size:11px;color:#71847f;text-transform:uppercase;margin-bottom:4px}
.value{font-size:17px;font-weight:700}
.obs{font-size:16px;line-height:1.5}
.contact a{display:block;background:#0f766e;color:#fff;text-decoration:none;text-align:center;padding:14px;border-radius:12px;font-weight:800;margin-top:10px}
.code{font-family:monospace;background:#eef8f6;padding:8px 10px;border-radius:10px;display:inline-block}
.empty{max-width:620px;margin:70px auto;background:#fff;border:1px solid #d8e9e5;border-radius:22px;padding:28px;text-align:center}
.empty h1{margin-top:0}
.muted{color:#68817b}
@media(max-width:600px){
 .wrap{padding:12px}
 .hero,.hero img{min-height:260px;height:260px}
 .name{font-size:30px}
 .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL="https://rughpuemhsriuiivwbag.supabase.co";
const SUPABASE_KEY="sb_publishable_Vc3jwQ_pxQlhPv6BNidZNg_iystTQtl";

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function siNo(v,si,no){return v===true?si:no}
function telefonoHref(v){return String(v||"").replace(/[^\d+]/g,"")}

async function buscarMascota(){
  const p=new URLSearchParams(location.search);
  const qr=p.get("qr");
  const id=p.get("id");

  // Nuevo sistema: si viene un QR, primero buscamos la placa en placas_qr.
  if(qr){
    const rp=await fetch(
      SUPABASE_URL+"/rest/v1/placas_qr?select=codigo,estado,mascota_id&codigo=eq."+encodeURIComponent(qr)+"&limit=1",
      {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}}
    );
    if(!rp.ok) throw new Error("No se pudo consultar la placa");
    const placas=await rp.json();

    if(!placas.length){
      return {estado:"no_encontrada",codigo:qr};
    }

    const placa=placas[0];

    // Placa fabricada, pero todavía sin mascota asignada.
    if(placa.mascota_id==null){
      return {estado:"sin_asignar",codigo:qr};
    }

    const rm=await fetch(
      SUPABASE_URL+"/rest/v1/mascotas?select=*&id=eq."+encodeURIComponent(placa.mascota_id)+"&limit=1",
      {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}}
    );
    if(!rm.ok) throw new Error("No se pudo consultar la mascota");
    const mascotas=await rm.json();

    if(!mascotas.length){
      return {estado:"sin_asignar",codigo:qr};
    }

    return {estado:"ok",mascota:mascotas[0],codigo:qr};
  }

  // Compatibilidad con los enlaces antiguos ?id=1
  if(id){
    const r=await fetch(
      SUPABASE_URL+"/rest/v1/mascotas?select=*&id=eq."+encodeURIComponent(id)+"&limit=1",
      {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}}
    );
    if(!r.ok) throw new Error("No se pudo consultar la ficha");
    const data=await r.json();
    if(!data.length) return {estado:"no_encontrada",codigo:id};
    return {estado:"ok",mascota:data[0],codigo:data[0].codigo_qr||("ID-"+data[0].id)};
  }

  return {estado:"sin_parametro"};
}

function fichaVacia(codigo){
  document.getElementById("app").innerHTML=`
    <div class="empty">
      <div class="brand">🐾 KION · MASCOTAS</div>
      <h1>Placa aún no registrada</h1>
      <p class="muted">Esta placa KION todavía no ha sido asignada a una mascota.</p>
      ${codigo?`<p>Código de placa:<br><span class="code">${esc(codigo)}</span></p>`:""}
      <p class="muted">Cuando sea registrada, este mismo QR mostrará aquí la ficha completa del animal.</p>
    </div>`;
}

function render(p,codigo){
  const foto=p.foto_url||"";
  const sexo=p.sexo||"No indicado";
  const raza=p.raza||"No indicada";
  const color=p.color||"No indicado";
  const nacimiento=p.fecha_nacimiento||"No indicada";
  const comuna=p.comuna||"No indicada";
  const nombre=p.nombre_mascota||"Mascota";
  const obs=p.observaciones||"Sin observaciones";
  const tel1=p.telefono_principal||"";
  const tel2=p.telefono_secundario||"";
  const dueno=p.nombre_dueno||"No indicado";

  document.getElementById("app").innerHTML=`
    <div class="wrap">
      <div class="brand">🐾 KION · MASCOTAS</div>
      <section class="hero">
        ${foto?`<img src="${esc(foto)}" alt="Foto de ${esc(nombre)}">`:""}
        <div class="overlay">
          <h1 class="name">${esc(nombre)}</h1>
          <div class="meta">${esc(sexo)} · ${esc(raza)} · ${esc(color)}</div>
          <div class="badges">
            <span class="badge">${siNo(p.tiene_chip,"● Tiene chip","○ Sin chip")}</span>
            <span class="badge">${siNo(p.esterilizado,"● Esterilizado/a","○ No esterilizado/a")}</span>
          </div>
        </div>
      </section>
      <div class="alert">🐾 <b>Estoy perdido/a</b><br>Si me encontraste, por favor comunícate con mi familia.</div>
      <section class="card">
        <h3>IDENTIFICACIÓN</h3>
        <div class="grid">
          <div><div class="label">Sexo</div><div class="value">${esc(sexo)}</div></div>
          <div><div class="label">Raza</div><div class="value">${esc(raza)}</div></div>
          <div><div class="label">Color</div><div class="value">${esc(color)}</div></div>
          <div><div class="label">Nacimiento</div><div class="value">${esc(nacimiento)}</div></div>
          <div><div class="label">Comuna</div><div class="value">${esc(comuna)}</div></div>
          <div><div class="label">Código placa</div><div class="value"><span class="code">${esc(codigo)}</span></div></div>
        </div>
      </section>
      <section class="card">
        <h3>OBSERVACIONES</h3>
        <div class="obs">${esc(obs)}</div>
      </section>
      <section class="card contact">
        <h3>CONTACTAR A MI FAMILIA</h3>
        <div class="label">Dueño / responsable</div>
        <div class="value">${esc(dueno)}</div>
        ${tel1?`<a href="tel:${esc(telefonoHref(tel1))}">📞 Llamar ${esc(tel1)}</a>`:""}
        ${tel2?`<a href="tel:${esc(telefonoHref(tel2))}">📞 Llamar contacto alternativo ${esc(tel2)}</a>`:""}
      </section>
    </div>`;
}

(async()=>{
  try{
    const res=await buscarMascota();
    if(res.estado==="ok") render(res.mascota,res.codigo);
    else fichaVacia(res.codigo);
  }catch(e){
    document.getElementById("app").innerHTML=`<div class="empty"><h1>No se pudo cargar la ficha</h1><p class="muted">${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
